<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JD生成器</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script>
  var client = new CozeWebSDK.WebChatClient({
    config: {
      bot_id: '7604366168362893321',
    },
    componentProps: {
      title: 'JD生成器',
    },
    userInfo: {
      id: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2),
    },
    auth: {
      type: 'token',
      token: 'pat_5BY30WDIl3FjyTsWSwDBjGkMwoaXrNdgjZFXxIkXgKEZTb76w0PTvslBRbM4sjbF',
      onRefreshToken: function () {
        return 'pat_5BY30WDIl3FjyTsWSwDBjGkMwoaXrNdgjZFXxIkXgKEZTb76w0PTvslBRbM4sjbF'
      }
    }
  });

  setTimeout(function () {
    client.showChatBot();

    // 找到聊天窗口并强制居中
    setTimeout(function () {
      var allDivs = document.querySelectorAll('div');
      for (var i = 0; i < allDivs.length; i++) {
        var s = window.getComputedStyle(allDivs[i]);
        if (s.position === 'fixed' && parseInt(s.width) > 300 && parseInt(s.height) > 300) {
          allDivs[i].style.cssText += ';left:50%!important;right:auto!important;transform:translateX(-50%)!important;';
        }
      }
      // 隐藏浮球
      var btns = document.querySelectorAll('div');
      for (var j = 0; j < btns.length; j++) {
        var bs = window.getComputedStyle(btns[j]);
        if (bs.position === 'fixed' && parseInt(bs.width) < 80 && parseInt(bs.height) < 80) {
          btns[j].style.display = 'none';
        }
      }
    }, 1000);
  }, 500);
</script>
  
<script>
window.history.replaceState(null, null, window.location.href);
</script>
  
</body>
</html>
